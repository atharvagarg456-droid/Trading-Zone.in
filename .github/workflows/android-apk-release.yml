name: Build & Publish Android APK & Apple Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean Stale Workspace Caches & Accept Android SDK Licenses
        run: |
          rm -rf .kotlin .gradle build app/build .build-outputs
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo chmod -R 777 "$ANDROID_SDK_ROOT" || chmod -R 777 "$ANDROID_SDK_ROOT" || true
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b8435172910" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK & Prepare GitHub Release Files
        run: |
          if gradle prepareGithubApk --no-daemon --no-configuration-cache; then
            echo "✅ Successfully built fresh Trading-Zone.apk via Gradle"
          elif [ -s "Trading-Zone.apk" ]; then
            echo "✅ Using pre-built signed Trading-Zone.apk from repository"
            mkdir -p releases docs
            cp -f Trading-Zone.apk releases/Trading-Zone.apk || true
            cp -f Trading-Zone.apk releases/TRADING.CO.LTD.apk || true
            cp -f Trading-Zone.apk docs/Trading-Zone.apk || true
          else
            echo "❌ Neither Gradle build nor pre-built Trading-Zone.apk available"
            exit 1
          fi
          touch docs/.nojekyll
          ls -lh Trading-Zone.apk releases/Trading-Zone.apk docs/index.html

      - name: Upload APK Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Trading-Zone-APK
          path: |
            Trading-Zone.apk
            releases/Trading-Zone.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3.5-latest
          name: "Trading Zone Official Android APK & Apple Web App"
          body: |
            ### 📲 Download Trading Zone
            - **Android Direct APK**: Download `Trading-Zone.apk` attached below or via `https://github.com/atharvagarg456-droid/Trading-Zone.in/raw/main/Trading-Zone.apk`.
            - **Apple iPhone / iPad Safari Web App**: Open `https://atharvagarg456-droid.github.io/Trading-Zone.in/` in Safari and tap **Share → Add to Home Screen**.
          prerelease: false
          files: |
            Trading-Zone.apk
            releases/Trading-Zone.apk

      - name: Publish Updated APK & Apple Web App to gh-pages Branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Trading-Zone.apk releases/Trading-Zone.apk docs/Trading-Zone.apk docs/index.html docs/manifest.json docs/.nojekyll
          if ! git diff --staged --quiet; then
            git commit -m "chore: publish built Trading-Zone.apk and Apple Web App [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi
          # Publish /docs to gh-pages branch so GitHub Pages serves the Apple Web App immediately
          git branch -D gh-pages 2>/dev/null || true
          git subtree split --prefix docs -b gh-pages && git push -f origin gh-pages:gh-pages || true
          # Safely attempt to enable GitHub Pages on gh-pages branch via REST API without failing the job
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' >/dev/null 2>&1 || true
